<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de contactos · SoftBrilliance</title>
  <style>
    :root { --primario: #1F3864; --acento: #2E75B6; --fondo-tabla: #D9E2F3; --borde: #8EAADB; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: var(--primario); }
    h1 { border-bottom: 2px solid var(--acento); padding-bottom: .5rem; }
    form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .5rem; margin: 1rem 0; }
    input, button { padding: .5rem; font: inherit; border: 1px solid var(--borde); border-radius: 4px; }
    button { background: var(--acento); color: #fff; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--borde); padding: .5rem; text-align: left; }
    th { background: var(--fondo-tabla); }
    #buscar { width: 100%; margin-bottom: 1rem; }
    #aviso { min-height: 1.5rem; margin: 0 0 .5rem; color: #C00000; }
    .btn-baja { background: #C00000; padding: .25rem .5rem; }
    .btn-editar { padding: .25rem .5rem; margin-right: .25rem; }
    .btn-secundario { background: #fff; color: var(--primario); border: 1px solid var(--borde); }
    .botones-form { display: flex; gap: .5rem; }
    .botones-form button { flex: 1; }
    tr.editando td { background: #FFF2CC; }
    .tabla-envoltura { overflow-x: auto; }
    .vacio { text-align: center; color: #666; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Agenda de contactos</h1>

  <form id="form-contacto">
    <input id="nombre" placeholder="Nombre" required maxlength="60">
    <input id="correo" type="email" placeholder="Correo" required maxlength="80">
    <input id="telefono" placeholder="Teléfono (9 dígitos)" required pattern="9[0-9]{8}">
    <div class="botones-form">
      <button type="submit" id="btn-guardar">Agregar</button>
      <button type="button" id="btn-cancelar" class="btn-secundario" hidden>Cancelar</button>
    </div>
  </form>
  <p id="aviso" role="alert" aria-live="polite"></p>

  <input id="buscar" type="search" placeholder="Buscar por nombre o correo" aria-label="Buscar por nombre o correo">

  <div class="tabla-envoltura">
  <table>
    <thead>
      <tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
  </div>
  <p id="contador"></p>

  <script>
    const CLAVE = 'agenda-contactos.v1';

    function cargar() {
      try {
        const datos = JSON.parse(localStorage.getItem(CLAVE) || '[]');
        return Array.isArray(datos) ? datos : [];
      } catch {
        return []; // datos dañados: se arranca con la lista vacía
      }
    }
    function guardar() {
      try { localStorage.setItem(CLAVE, JSON.stringify(contactos)); } catch { /* sin almacenamiento: se trabaja en memoria */ }
    }

    const contactos = cargar();
    const lista = document.getElementById('lista');
    const buscar = document.getElementById('buscar');
    const aviso = document.getElementById('aviso');
    const form = document.getElementById('form-contacto');
    const btnGuardar = document.getElementById('btn-guardar');
    const btnCancelar = document.getElementById('btn-cancelar');
    let idEditando = null; // id del contacto en edición; null = modo alta

    // Correo ocupado por otro contacto activo (se excluye el que se está editando)
    function correoOcupado(correo, excluirId) {
      return contactos.some(c => c.estado === 'ACTIVO' && c.id !== excluirId && c.correo.toLowerCase() === correo);
    }

    function iniciarEdicion(id) {
      const c = contactos.find(x => x.id === id && x.estado === 'ACTIVO');
      if (!c) return;
      idEditando = id;
      document.getElementById('nombre').value = c.nombre;
      document.getElementById('correo').value = c.correo;
      document.getElementById('telefono').value = c.telefono;
      btnGuardar.textContent = 'Guardar cambios';
      btnCancelar.hidden = false;
      aviso.textContent = '';
      render();
      document.getElementById('nombre').focus();
    }

    function terminarEdicion() {
      idEditando = null;
      form.reset();
      btnGuardar.textContent = 'Agregar';
      btnCancelar.hidden = true;
      render();
    }

    function render() {
      lista.innerHTML = '';
      const activos = contactos.filter(c => c.estado === 'ACTIVO');
      const texto = buscar.value.trim().toLowerCase();
      const visibles = texto
        ? activos.filter(c => c.nombre.toLowerCase().includes(texto) || c.correo.toLowerCase().includes(texto))
        : activos;
      for (const c of visibles) {
        const fila = document.createElement('tr');
        for (const valor of [c.nombre, c.correo, c.telefono]) {
          const celda = document.createElement('td');
          celda.textContent = valor; // evita inyección de HTML
          fila.appendChild(celda);
        }
        const acciones = document.createElement('td');
        if (c.id === idEditando) fila.className = 'editando';
        const editar = document.createElement('button');
        editar.type = 'button';
        editar.className = 'btn-editar';
        editar.textContent = 'Editar';
        editar.addEventListener('click', () => iniciarEdicion(c.id));
        acciones.appendChild(editar);
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'btn-baja';
        boton.textContent = 'Dar de baja';
        boton.addEventListener('click', () => darDeBaja(c.id));
        acciones.appendChild(boton);
        fila.appendChild(acciones);
        lista.appendChild(fila);
      }
      if (visibles.length === 0) {
        const fila = document.createElement('tr');
        const celda = document.createElement('td');
        celda.colSpan = 4;
        celda.className = 'vacio';
        celda.textContent = texto ? 'Ningún contacto coincide con la búsqueda' : 'No hay contactos activos';
        fila.appendChild(celda);
        lista.appendChild(fila);
      }
      document.getElementById('contador').textContent = activos.length + ' contacto(s) activo(s)'
        + (texto ? ' · ' + visibles.length + ' coinciden con la búsqueda' : '');
    }

    // Baja lógica: se marca INACTIVO con fecha de baja; nunca se borra del arreglo
    function darDeBaja(id) {
      const c = contactos.find(x => x.id === id && x.estado === 'ACTIVO');
      if (!c) return;
      if (!confirm('¿Dar de baja a ' + c.nombre + ' (' + c.correo + ')?')) return;
      c.estado = 'INACTIVO';
      c.fechaBaja = new Date().toISOString();
      guardar();
      aviso.textContent = '';
      if (idEditando === id) terminarEdicion(); else render();
    }

    buscar.addEventListener('input', render);

    btnCancelar.addEventListener('click', () => { aviso.textContent = ''; terminarEdicion(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim().toLowerCase();
      const telefono = document.getElementById('telefono').value.trim();
      if (!nombre || !correo || !/^9\d{8}$/.test(telefono)) return;
      if (correoOcupado(correo, idEditando)) {
        aviso.textContent = 'Ya existe un contacto activo con el correo ' + correo + '.';
        document.getElementById('correo').focus();
        return;
      }
      aviso.textContent = '';
      if (idEditando !== null) {
        const c = contactos.find(x => x.id === idEditando && x.estado === 'ACTIVO');
        if (c) Object.assign(c, { nombre, correo, telefono, fechaModificacion: new Date().toISOString() });
        guardar();
        terminarEdicion();
        return;
      }
      contactos.push({ id: Date.now(), nombre, correo, telefono, estado: 'ACTIVO', fechaBaja: null });
      guardar();
      e.target.reset();
      render();
    });

    render();
  </script>
</body>
</html>
